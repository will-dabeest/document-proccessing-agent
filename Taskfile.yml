version: "3"

vars:
  COMPOSE: docker compose -f infra/docker-compose.yml

tasks:
  dev:
    desc: Build and run the full stack (LocalStack, Terraform, API, worker, frontend)
    cmds:
      - "{{.COMPOSE}} up --build"

  down:
    desc: Stop and remove compose services
    cmds:
      - "{{.COMPOSE}} down"

  logs:
    desc: Follow compose logs
    cmds:
      - "{{.COMPOSE}} logs -f"

  test:
    desc: Run Python tests from repo root
    cmds:
      - python -m pytest -q

  fe-build:
    desc: Production build of the frontend
    dir: frontend
    cmds:
      - npm ci
      - npm run build

  compose-config:
    desc: Validate compose file interpolation
    cmds:
      - "{{.COMPOSE}} config --quiet"

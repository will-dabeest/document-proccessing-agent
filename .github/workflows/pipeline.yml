name: Pipeline

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt flake8
      - name: Lint
        run: flake8 service-ingestion service-worker shared --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - name: Terraform fmt and validate
        working-directory: infra
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
      - name: tfsec
        run: docker run --rm -v "${{ github.workspace }}/infra:/src" aquasec/tfsec:latest /src --soft-fail

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose file
        run: docker compose -f infra/docker-compose.yml config --quiet

name: doc-processing

services:
  localstack:
    # Pinned: :latest may require LOCALSTACK_AUTH_TOKEN (LocalStack Cloud licensing).
    image: localstack/localstack:4.4.0
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      SERVICES: s3,dynamodb,sqs,secretsmanager
      DEBUG: "1"
      # Align SQS queue URLs with hardcoded QUEUE_URL (…/000000000000/jobs). LocalStack 4
      # defaults to SQS_ENDPOINT_STRATEGY=standard (AWS-style host), which does not match.
      SQS_ENDPOINT_STRATEGY: "off"
      # Host:port returned in queue URLs so other Compose services resolve LocalStack.
      LOCALSTACK_HOST: "localstack:4566"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:4566/_localstack/health >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  terraform:
    image: hashicorp/terraform:1.7
    working_dir: /workspace/infra
    volumes:
      - ..:/workspace
    environment:
      TF_VAR_localstack_endpoint: http://localstack:4566
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "terraform init -backend=false -input=false && terraform apply -input=false -auto-approve",
      ]
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

  ingestion:
    build:
      context: ..
      dockerfile: infra/Dockerfile.ingestion
    ports:
      - "8000:8000"
    environment:
      USE_LOCALSTACK: "true"
      AWS_ENDPOINT_URL: http://localstack:4566
      QUEUE_URL: http://localstack:4566/000000000000/jobs
      BUCKET_NAME: doc-storage
      DYNAMODB_TABLE: ProcessLog
      OTLP_ENDPOINT: jaeger:4317
      CHROMA_PERSIST_DIR: /data/chroma
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3:latest
      OLLAMA_HTTP_TIMEOUT_SECONDS: "600"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - chroma_data:/data/chroma
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      terraform:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
      ollama:
        condition: service_started
    extra_hosts:
      # Lets containers reach Ollama on the host via host.docker.internal (esp. Linux Engine).
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    environment:
      USE_LOCALSTACK: "true"
      AWS_ENDPOINT_URL: http://localstack:4566
      QUEUE_URL: http://localstack:4566/000000000000/jobs
      BUCKET_NAME: doc-storage
      DYNAMODB_TABLE: ProcessLog
      INGESTION_BASE_URL: http://ingestion:8000
      OTLP_ENDPOINT: jaeger:4317
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3:latest
      OLLAMA_HTTP_TIMEOUT_SECONDS: "600"
    env_file:
      - path: ../.env
        required: false
    depends_on:
      terraform:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      ingestion:
        condition: service_healthy
      ollama:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      INGESTION_PROXY_TARGET: http://ingestion:8000
    depends_on:
      ingestion:
        condition: service_healthy

  # Starts with no models; run once: docker compose exec ollama ollama pull <OLLAMA_MODEL>
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  chroma_data:
  ollama_data:
